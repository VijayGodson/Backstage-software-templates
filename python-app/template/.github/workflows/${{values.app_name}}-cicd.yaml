name: ${{values.app_name}}-cicd

on:
  push:
    #paths:
     # - src/**
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: "{% raw %}${{ secrets.DOCKERHUB_USERNAME }}{% endraw %}"
          password: "{% raw %}${{ secrets.DOCKERHUB_TOKEN }}{% endraw %}"

      - name: Set Short SHA
        id: sha_step
        run: |
          SHORT_SHA=$(echo ${GITHUB_SHA} | cut -c1-6)
          echo "COMMIT_ID=${SHORT_SHA}" >> $GITHUB_ENV
          echo "commit_id=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: "vijaygodson/${{values.app_name}}:{% raw %}${{ env.COMMIT_ID }}{% endraw %}"

    outputs:
      #commit_id: "{% raw %}${{ env.COMMIT_ID }}{% endraw %}"
      commit_id: "${{ steps.sha_step.outputs.commit_id }}"

  cd:
    needs: ci
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: clone repository
        uses: actions/checkout@v4

      - name: modify values.yaml file for argocd
        shell: bash
        run: |
          echo "updating with ${{ needs.ci.outputs.commit_id }}"
          if ! command -v pip3 &> /dev/null; then
            echo 'pip not found. Installing pip3'
            sudo apt-get update && sudo apt-get install python3-pip wget -y
          else
            echo 'pip3 is already installed'
          fi

          if ! command -v yq &> /dev/null; then
            echo 'yq not found. Installing yq'
            sudo curl -Lo /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
            sudo chmod +x /usr/local/bin/yq
          else
            echo 'yq is already installed'
          fi

          yq eval '.image.tag = "{% raw %}${{ needs.ci.outputs.commit_id }}{% endraw %}"' -i charts/${{values.app_name}}/values-${{values.app_env}}.yaml

      - name: commit changes
        uses: EndBug/add-and-commit@v9
        with:
          message: 'updates values.yaml wit commit ${{needs.ci.outputs.commit_id}}'

      - name: Install argocd-server
        shell: bash
        run: |
          curl -ksSL -o argocd https://argocd-server.argocd/download/argocd-linux-amd64 
          chmod +x argocd 
          sudo mv ./argocd /usr/local/bin/argocd

      - name: Argocd login
        shell: bash
        run: |
          argocd login argocd-server.argocd \
            --insecure \
            --grpc-web \
            --username "{% raw %}${{ secrets.ARGOCD_USERNAME }}{% endraw %}" \
            --password "{% raw %}${{ secrets.ARGOCD_PASSWORD}}{% endraw %}"

      - name: Ensure argocd repo, app and sync
        shell: bash
        run: |
          repo="https://github.com/Vijay-godson/${{values.app_name}}.git"
          argocd repo list | grep -q $repo || argocd repo add $repo
          argocd app get ${{values.app_name}} || argocd app create ${{values.app_name}} --repo $repo --path "charts/${{values.app_name}}" --dest-namespace "${{values.app_env}}" --dest-server "https://kubernetes.default.svc" --values "values-${{values.app_env}}.yaml" --revision "main" --sync-policy "manual" --sync-option "CreateNamespace=true"
          argocd app sync ${{values.app_name}}
          argocd app wait ${{values.app_name}} --timeout 180