replicaCount: 1
image:
  # This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
  repository: "vijaygodson/${{values.app_name}}"
  pullPolicy: Always
  tag: "${{values.app_name}}-${{values.app_nenvv}}:latest"

resources:
  requests:
    cpu: 40m
    memory: 40M