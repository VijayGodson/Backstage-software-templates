apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: aws-EC2-instance
  title: AWS EC2 Instance
  description: Self-service EC2 provisioning via Terraform
spec:
  owner: platform-team
  type: resource

  parameters:
    - title: EC2 Instance details
      required:
        - InstanceName
        - InstanceType
        - Region
        - owner
        - DockerImage
        - DevDockerRepo
      properties:
        InstanceName:
          title: Instance name
          type: string
          pattern: '^[a-z][a-z0-9-]{2,62}$'
          description: Provide a name to the EC2 instance
        Region:
          title: Region
          type: string
          enum: [us-east-1, us-east-2, us-west-1,us-west-2]
          description: Select a region
        InstanceType:
          title: Instance Type
          type: string
          enum: [t3.micro, t3.small, c7i-flex.large,m7i-flex.large,t8i.micro,t8i.small]
          description: Select an instance type
        owner:
          title: Owner
          type: string
          enum: [development]
          description: Owner of this instance
        DockerImage:
          title: Application Version
          type: string
          default: vijaygodson/demo-website:latest
          ui:field: DockerHubTagPicker
          description: select the artifact version
        DevDockerRepo:
          title: Your Docker Hub repo
          type: string
          pattern: '^[a-z0-9._-]+/[a-z0-9._-]+$'
          description: YOUR Docker Hub repository (e.g. myuser/myapp). Your changes are built and pushed here — never to the main release repo.

  steps:
    - id: fetch
      name: Fetch EC2 details
      action: fetch:template
      input:
        url: ./content
        values:
          InstanceName: ${{ parameters.InstanceName }}
          InstanceType: ${{ parameters.InstanceType }}
          Region: ${{ parameters.Region }}
          owner: ${{ parameters.owner }}
          DockerImage: ${{ parameters.DockerImage }}
          DevDockerRepo: ${{ parameters.DevDockerRepo }}

    - id: create_repo
      name: Creating github repo
      action: publish:github
      input:
        repoUrl: github.com?owner=Vijay-godson&repo=${{ parameters.InstanceName }}-EC2-instance
        description: Terraform-managed EC2 instance for ${{ parameters.InstanceName }}
        repoVisibility: public

    - id: register
      name: Register in catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.create_repo.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Github repo
        url: ${{ steps.create_repo.output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
