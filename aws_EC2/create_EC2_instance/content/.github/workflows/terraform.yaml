name: Terraform
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    
permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::003904517980:role/backstage-terraform-github-actions
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
      
      - name: Terraform Init
        run: terraform init -backend-config="key=ec2-instances/${{ values.InstanceName }}/terraform.tfstate"

      - name: Reconcile Orphaned Key Pair
        if: github.event_name == 'push'
        run: |
          KEY_NAME="${{ values.InstanceName }}-key"
          if aws ec2 describe-key-pairs --key-names "$KEY_NAME" > /dev/null 2>&1; then
            if terraform state list 2>/dev/null | grep -q "aws_key_pair.deployer"; then
              echo "Key pair $KEY_NAME is managed by this state - leaving it untouched"
            else
              echo "Key pair $KEY_NAME exists in AWS but not in this state (orphan) - deleting it"
              aws ec2 delete-key-pair --key-name "$KEY_NAME"
            fi
          else
            echo "No existing key pair named $KEY_NAME - nothing to reconcile"
          fi

      - name: tfsec scan
        uses: aquasecurity/tfsec-action@v1.0.3

      - name: Terraform Plan
        if: github.event_name == 'pull_request'
        run: terraform plan -var-file=terraform.tfvars

      - name: Terraform Apply
        if: github.event_name == 'push'
        run: terraform apply -var-file=terraform.tfvars -auto-approve
