apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: aws-EC2-instance
  title: AWS EC2 Instance
  description: Self-service EC2 provisioning via Terraform
spec:
  owner: platform-team
  type: resource

  parameters:
    - title: EC2 Instance details
      required:
        - InstanceName
        - InstanceType
        - Region
      properties:
        InstanceName:
          title: Instance name
          type: string
          pattern: '^[a-z][a-z0-9-]{2,62}$'
          description: Provide a name to the EC2 instance
        Region:
          title: Region
          type: string
          enum: [us-east-1, us-east-2, us-west-1,us-west-2]
          description: Select a region
        InstanceType:
          title: Instance Type
          type: string
          enum: [t3.micro, t3.small, c7i-flex.large,m7i-flex.large,t8i.micro,t8i.small]
          description: Select an instance type

  steps:
    - id: fetch
      name: Fetch module template
      action: fetch:template
      input:
        url: ./content
        values:
          InstanceName: ${{ parameters.InstanceName }}
          InstanceType: ${{ parameters.InstanceType }}
          Region: ${{ parameters.Region }}

    - id: Create
      name: Creating EC2 instance
      action: publish:github
      input:
        repoUrl: github.com?owner=Vijay-godson&repo=${{ parameters.InstanceName }}-infra
        description: Terraform-managed S3 bucket for ${{ parameters.InstanceName }}
        repoVisibility: public

    - id: register
      name: Register in catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Infra repo
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
