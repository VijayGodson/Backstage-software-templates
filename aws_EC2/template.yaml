apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: aws-EC2-instance
  title: AWS EC2 Instance
  description: Self-service EC2 provisioning via Terraform
spec:
  owner: platform-team
  type: resource

  parameters:
    - title: EC2 Instance details
      required:
        - InstanceName
        - InstanceType
      properties:
        InstanceName:
          title: Instance name
          type: string
          pattern: '^[a-z][a-z0-9-]{2,62}$'
          description: Provide a name to the EC2 instance
        owner:
          title: Owning team
          type: string
        environment:
          title: Environment
          type: string
          enum: [dev, staging, prod]
        component:
          title: Component this bucket belongs to
          type: string
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind: Component

  steps:
    - id: fetch
      name: Fetch module template
      action: fetch:template
      input:
        url: ./content
        values:
          bucketName: ${{ parameters.bucketName }}
          owner: ${{ parameters.owner }}
          environment: ${{ parameters.environment }}

    - id: publish
      name: Publish infra repo
      action: publish:github
      input:
        repoUrl: github.com?owner=Vijay-godson&repo=${{ parameters.bucketName }}-infra
        description: Terraform-managed S3 bucket for ${{ parameters.bucketName }}
        repoVisibility: public

    - id: register
      name: Register in catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Infra repo
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
