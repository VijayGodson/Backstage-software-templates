apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.bucketName }}
  description: S3 bucket, environment ${{ values.environment }}
  annotations:
    github.com/project-slug: Vijay-godson/${{ values.bucketName }}-infra
spec:
  type: service
  lifecycle: experimental
  owner: ${{ values.owner }}
  dependsOn:
    - component:${{ values.component | default("unknown-component") }}
