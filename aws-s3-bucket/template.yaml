apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: aws-s3-bucket
  title: AWS S3 Bucket
  description: Self-service S3 bucket provisioning via Terraform, with PR-based plan/apply
  tags:
    - aws
    - terraform
    - infrastructure
spec:
  owner: platform-team
  type: resource

  parameters:
    - title: Bucket details
      required:
        - bucketName
        - owner
        - environment
      properties:
        bucketName:
          title: Bucket name
          type: string
          pattern: '^[a-z][a-z0-9-]{2,62}$'
          description: Must be globally unique across all of AWS
        owner:
          title: Owning team
          type: string
        environment:
          title: Environment
          type: string
          enum: [dev, staging, prod]
        component:
          title: Component this bucket belongs to
          type: string
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind: Component

  steps:
      - id: fetch
      name: Fetch module template
      action: fetch:template
      input:
        url: ./content
        values:
          bucketName: ${{ parameters.bucketName }}
          owner: ${{ parameters.owner }}
          environment: ${{ parameters.environment }}
          component: ${{ parameters.component }}

    - id: publish
      name: Publish infra repo
      action: publish:github
      input:
        repoUrl: github.com?owner=Vijay-godson&repo=${{ parameters.bucketName }}-infra
        description: Terraform-managed S3 bucket for ${{ parameters.bucketName }}

    - id: register
      name: Register in catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Infra repo
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
